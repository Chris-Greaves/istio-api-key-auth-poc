<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>API Key Authenticator</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<h1>API Keys</h1>

	<section id="create-key">
		<h2>Create a new key</h2>
		<form id="create-key-form">
			<label for="owner">Owner</label>
			<input id="owner" name="owner" type="text" required />

			<label for="expires-at">Expiry (optional)</label>
			<input id="expires-at" name="expires_at" type="date" />

			<button type="submit">Create key</button>
		</form>

		<p id="create-key-error" class="error" hidden></p>

		<div id="new-key-banner" hidden>
			<p>
				This is the only time this key will be shown. Copy it now
				&mdash; it cannot be retrieved later.
			</p>
			<code id="new-key-value"></code>
		</div>
	</section>

	<section id="test-key">
		<h2>Test a key</h2>
		<form id="test-key-form">
			<label for="test-key-input">API Key</label>
			<input id="test-key-input" name="key" type="text" placeholder="api_xxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" required />

			<button type="submit">Test key</button>
		</form>

		<p id="test-key-result" class="key-test-result" hidden></p>
	</section>

	<section id="key-list">
		<h2>Existing keys</h2>
		<p id="revoke-key-error" class="error" hidden></p>
		<table>
			<thead>
				<tr>
					<th>Key ID</th>
					<th>Owner</th>
					<th>Created</th>
					<th>Expires</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="key-list-body"></tbody>
		</table>
	</section>

	<section id="key-usage" hidden>
		<h2>Usage for <code id="usage-key-id"></code></h2>
		<p id="usage-loading">Loading&hellip;</p>
		<p id="usage-error" class="error" hidden></p>
		<p id="usage-empty" hidden>No usage recorded for this key in this time range.</p>
		<canvas id="usage-canvas" width="600" height="200"></canvas>
		<button type="button" id="usage-close">Close</button>
	</section>

	<script src="app.js"></script>
</body>
</html>
