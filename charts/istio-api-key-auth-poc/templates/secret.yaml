{{- /*
Only rendered for the bundled-Postgres case. The external-DB case (default)
relies on a Secret the operator creates themselves — this chart never
materializes a connection string it wasn't handed for a database it doesn't
own (ADR-0005).
*/ -}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "istio-api-key-auth-poc.databaseSecretName" . }}
  labels:
    {{- include "istio-api-key-auth-poc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* urlquery percent-encodes URI-reserved characters (e.g. "@", "/", ":") so a generated password containing them doesn't corrupt the DSN's host/path parsing. */}}
  {{ include "istio-api-key-auth-poc.databaseSecretKey" . }}: {{ printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" (urlquery .Values.postgresql.auth.username) (urlquery .Values.postgresql.auth.password) (include "istio-api-key-auth-poc.postgresqlHost" .) .Values.postgresql.auth.database | quote }}
{{- end }}
